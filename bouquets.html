    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      try {
        var d = document.documentElement;
        if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
          d.classList.add('js-motion');
          if (sessionStorage.getItem('sgf-t')) d.classList.add('is-entering');
          // Secours : si le module ne démarre pas en 3 s, on affiche la page sans mouvement.
          setTimeout(function () { if (!d.classList.contains('motion-ready')) d.classList.remove('js-motion', 'is-entering'); }, 3000);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript><p style="padding:6rem 1.5rem 2rem;font-family:system-ui">Ce site a besoin de JavaScript pour s’afficher. Saint Germain des Fleurs, 4 place Saint-Germain, Rennes : 07 84 87 20 23, saintgermaindesfleurs@gmail.com.</p></noscript>
    <script type="module" src="/src/pages/bouquets.ts"></script>
  </body>
