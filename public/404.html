      @media (prefers-color-scheme: dark) { :root { --bg: #1c1b19; --ink: #efe8da; --accent: #f08a62; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem 1.25rem; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; line-height: 1.55; }

      a.btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
      .tag { display: inline-block; margin-bottom: 1.4rem; padding: 0.3rem 0.8rem; background: #c9a27e; color: #3b2a1a; font: 0.75rem ui-monospace, monospace; transform: rotate(-3deg); }
      @media (prefers-reduced-motion: no-preference) { svg { animation: sway 5s ease-in-out infinite alternate; transform-origin: 50% 100%; } }
